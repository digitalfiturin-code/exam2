name: Build CBT Exambrowser Multi-Platform
run-name: 'Build: ${{ inputs.school_name }} - ${{ inputs.app_name }} (${{ inputs.build_code }})'

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_code:
        description: 'Kode Unik Build'
        required: true
        default: 'BLD-TEST-001'
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'EXAMPRO'
      school_name:
        description: 'Nama Sekolah'
        required: true
        default: 'SMPN 4 DEPOK'
      cbt_url:
        description: 'URL Server CBT Ujian'
        required: true
        default: 'https://cbt.sekolahsaya.sch.id'
      exit_pin:
        description: 'PIN Keluar Ujian'
        required: true
        default: '085086'
      custom_user_agent:
        description: 'Custom User-Agent'
        required: false
        default: 'MSAT-ExamBrowser-V1'
      enable_alert_sound:
        description: 'Aktifkan Suara Alert (true/false)'
        required: false
        default: 'false'
      alert_volume:
        description: 'Tingkat Volume Suara Alert (0.10 - 1.00)'
        required: false
        default: '0.8'
      screen_brightness:
        description: 'Kecerahan Layar (0.10 - 1.00)'
        required: false
        default: '0.4'
      target_platform:
        description: 'Target Platform Output (APK, EXE, ALL)'
        required: true
        default: 'APK'
      logo_blob_sha:
        description: 'Git Blob SHA for Custom Logo PNG'
        required: false
        default: ''
      custom_audio_blob_sha:
        description: 'Git Blob SHA for Custom Alert Audio MP3'
        required: false
        default: ''
      logo_base64:
        description: 'Base64 Encoded Logo PNG (Legacy)'
        required: false
        default: ''
      custom_audio_base64:
        description: 'Base64 Encoded Custom Alert Audio MP3 (Legacy)'
        required: false
        default: ''

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: ANDROID APK BUILD (UBUNTU RUNNER)
  # ══════════════════════════════════════════════════════════════
  build-android-apk:
    name: 'Build Android (.APK) - ${{ inputs.school_name }}'
    if: inputs.target_platform == 'APK' || inputs.target_platform == 'ALL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Custom Logo
        if: inputs.logo_blob_sha != '' || inputs.logo_base64 != ''
        run: |
          mkdir -p assets
          if [ -n "${{ inputs.logo_blob_sha }}" ]; then
            echo "Downloading custom logo from GitHub Git Blob SHA: ${{ inputs.logo_blob_sha }}..."
            curl -s -f -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/git/blobs/${{ inputs.logo_blob_sha }}" \
              -o assets/logo.png
          elif [ -n "${{ inputs.logo_base64 }}" ]; then
            echo "Decoding legacy Base64 logo..."
            echo "${{ inputs.logo_base64 }}" | base64 --decode > assets/logo.png
          fi
          ls -lh assets/logo.png

      - name: Fetch Custom Audio Alert
        if: inputs.custom_audio_blob_sha != '' || inputs.custom_audio_base64 != ''
        run: |
          mkdir -p assets
          if [ -n "${{ inputs.custom_audio_blob_sha }}" ]; then
            echo "Downloading custom audio alert from GitHub Git Blob SHA: ${{ inputs.custom_audio_blob_sha }}..."
            curl -s -f -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/git/blobs/${{ inputs.custom_audio_blob_sha }}" \
              -o assets/alert.mp3
          elif [ -n "${{ inputs.custom_audio_base64 }}" ]; then
            echo "Decoding legacy Base64 audio..."
            echo "${{ inputs.custom_audio_base64 }}" | base64 --decode > assets/alert.mp3
          fi
          ls -lh assets/alert.mp3

      - name: Inject Parameters to lib/main.dart
        run: |
          sed -i 's|final String schoolName = ".*";|final String schoolName = "${{ inputs.school_name }}";|g' lib/main.dart
          sed -i 's|final String exitPassword = ".*";|final String exitPassword = "${{ inputs.exit_pin }}";|g' lib/main.dart
          sed -i 's|final String customUserAgent = ".*";|final String customUserAgent = "${{ inputs.custom_user_agent }}";|g' lib/main.dart
          sed -i 's|final bool enableAlertAudio = .*;|final bool enableAlertAudio = ${{ inputs.enable_alert_sound }};|g' lib/main.dart
          sed -i 's|final double alertAudioVolume = .*;|final double alertAudioVolume = ${{ inputs.alert_volume }};|g' lib/main.dart
          sed -i 's|final double autoScreenBrightness = .*;|final double autoScreenBrightness = ${{ inputs.screen_brightness }};|g' lib/main.dart
          sed -i 's|String currentUrl = ".*";|String currentUrl = "${{ inputs.cbt_url }}";|g' lib/main.dart
          sed -i 's|currentUrl = "https://sites.google.com/guru.smp.belajar.id/asesmenpasmer/home";|currentUrl = "${{ inputs.cbt_url }}";|g' lib/main.dart

      - name: Download Dependencies
        run: flutter pub get

      - name: Initialize Android Folder
        run: flutter create . --platforms android --org com.xcoding

      - name: Generate App Icons
        run: |
          ls -l assets/logo.png
          dart run flutter_launcher_icons

      - name: Configure Android Native
        run: |
          PKG_NAME="com.xcoding.exam_browser"
          PKG_PATH="android/app/src/main/kotlin/com/xcoding/exam_browser"
          mkdir -p $PKG_PATH

          cat << 'EOF' > $PKG_PATH/MainActivity.kt
          package com.xcoding.exam_browser
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.os.Bundle
          import android.view.WindowManager
          import android.view.KeyEvent
          import android.provider.Settings
          import android.os.Build
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.os.VibrationEffect
          import android.media.AudioManager
          import android.media.AudioDeviceInfo
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.content.Context
          import android.app.admin.DeviceAdminReceiver

          class AdminReceiver : DeviceAdminReceiver()

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.xcoding.exam_browser/security"
              private var mediaPlayer: MediaPlayer? = null
              private var vibrator: Vibrator? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  window.decorView.setFilterTouchesWhenObscured(true)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "checkSecurity" -> {
                              val map = HashMap<String, Boolean>()
                              map["isDevOptionsEnabled"] = isDevOptionsEnabled()
                              map["isEmulator"] = isEmulator()
                              map["isHeadsetConnected"] = isHeadsetConnected()
                              result.success(map)
                          }
                          "setVolume" -> {
                              try {
                                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                                  val maxVolume = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                  val targetVolume = (maxVolume * 0.4).toInt()
                                  audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, targetVolume, 0)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "playAlarm" -> {
                              playEmergencyAlarm()
                              result.success(true)
                          }
                          "stopAlarm" -> {
                              stopEmergencyAlarm()
                              result.success(true)
                          }
                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }

              private fun playEmergencyAlarm() {
                  try {
                      val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val maxAlarmVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_ALARM)
                      val maxMusicVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      audioManager.setStreamVolume(AudioManager.STREAM_ALARM, maxAlarmVol, 0)
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, maxMusicVol, 0)

                      if (vibrator == null) {
                          vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              val vibratorManager = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                              vibratorManager.defaultVibrator
                          } else {
                              @Suppress("DEPRECATION")
                              getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                          }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 500, 200, 500), 0))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(longArrayOf(0, 500, 200, 500), 0)
                      }

                      if (mediaPlayer == null) {
                          mediaPlayer = MediaPlayer()
                          try {
                              val fd = assets.openFd("flutter_assets/assets/alert.mp3")
                              mediaPlayer?.setDataSource(fd.fileDescriptor, fd.startOffset, fd.length)
                          } catch (e: Exception) {
                              val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                                  ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                              mediaPlayer?.setDataSource(this, alarmUri)
                          }
                          
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              mediaPlayer?.setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_ALARM)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                      .build()
                              )
                          } else {
                              @Suppress("DEPRECATION")
                              mediaPlayer?.setAudioStreamType(AudioManager.STREAM_ALARM)
                          }
                          mediaPlayer?.isLooping = true
                          mediaPlayer?.prepare()
                      }
                      if (mediaPlayer?.isPlaying == false) {
                          mediaPlayer?.start()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun stopEmergencyAlarm() {
                  try {
                      vibrator?.cancel()
                      mediaPlayer?.let {
                          if (it.isPlaying) {
                              it.stop()
                          }
                          it.release()
                      }
                      mediaPlayer = null
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  stopEmergencyAlarm()
                  super.onDestroy()
              }

              override fun dispatchKeyEvent(event: KeyEvent?): Boolean {
                  if (event?.keyCode == KeyEvent.KEYCODE_VOLUME_UP || 
                      event?.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN ||
                      event?.keyCode == KeyEvent.KEYCODE_VOLUME_MUTE) {
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun isDevOptionsEnabled(): Boolean {
                  val devOptions = Settings.Global.getInt(contentResolver, Settings.Global.DEVELOPMENT_SETTINGS_ENABLED, 0) != 0
                  val adbEnabled = Settings.Global.getInt(contentResolver, Settings.Global.ADB_ENABLED, 0) != 0
                  return devOptions || adbEnabled
              }

              private fun isEmulator(): Boolean {
                  return (Build.BRAND.startsWith("generic") && Build.DEVICE.startsWith("generic"))
                          || Build.FINGERPRINT.startsWith("generic")
                          || Build.FINGERPRINT.startsWith("unknown")
                          || Build.HARDWARE.contains("goldfish")
                          || Build.HARDWARE.contains("ranchu")
                          || Build.MODEL.contains("google_sdk")
                          || Build.MODEL.contains("Emulator")
                          || Build.MODEL.contains("Android SDK built for x86")
                          || Build.MANUFACTURER.contains("Genymotion")
                          || Build.PRODUCT.contains("sdk_google")
                          || Build.PRODUCT.contains("google_sdk")
                          || Build.PRODUCT.contains("sdk")
                          || Build.PRODUCT.contains("sdk_x86")
                          || Build.PRODUCT.contains("vbox86p")
                          || Build.PRODUCT.contains("emulator")
                          || Build.PRODUCT.contains("simulator")
              }

              private fun isHeadsetConnected(): Boolean {
                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val devices = audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS)
                      for (device in devices) {
                          val type = device.type
                          if (type == AudioDeviceInfo.TYPE_WIRED_HEADSET ||
                              type == AudioDeviceInfo.TYPE_WIRED_HEADPHONES ||
                              type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP ||
                              type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                              type == AudioDeviceInfo.TYPE_USB_HEADSET) {
                              return true
                          }
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      return audioManager.isWiredHeadsetOn || audioManager.isBluetoothA2dpOn
                  }
                  return false
              }
          }
          EOF

          cp AndroidManifest_Strict.xml android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label=".*"|android:label="${{ inputs.app_name }}"|g' android/app/src/main/AndroidManifest.xml || true

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/device_admin.xml
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <limit-password />
                  <watch-login />
                  <reset-password />
                  <force-lock />
                  <wipe-data />
                  <expire-password />
                  <encrypted-storage />
                  <disable-camera />
                  <disable-keyguard-features />
              </uses-policies>
          </device-admin>
          EOF

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle
          fi

          echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties

      - name: Universal Plugin Patch (Namespace, SDK & Proguard Fix)
        run: |
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" -o -name "build.gradle.kts" | while read -r file; do
            if [[ "$file" == *.gradle ]] && ! grep -q "namespace" "$file"; then
              PARENT_DIR=$(dirname "$file")
              PUBSPEC_PATH="$(dirname "$PARENT_DIR")/pubspec.yaml"
              PACKAGE_NAME=""
              if [ -f "$PUBSPEC_PATH" ]; then
                PACKAGE_NAME=$(grep -oP 'package:\s*\K[a-zA-Z0-9_.]+' "$PUBSPEC_PATH" | head -1)
              fi
              if [ -z "$PACKAGE_NAME" ]; then
                MANIFEST_PATH="$PARENT_DIR/src/main/AndroidManifest.xml"
                if [ -f "$MANIFEST_PATH" ]; then
                  PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_PATH" | head -1)
                fi
              fi
              if [ -n "$PACKAGE_NAME" ]; then
                echo "Patching namespace for $PACKAGE_NAME in $file"
                sed -i "s/android {/android {\n    namespace \"$PACKAGE_NAME\"/" "$file"
              fi
            fi

            sed -i -E 's/.*compileSdkVersion.*/    compileSdk = 36/g' "$file"
            sed -i -E 's/.*targetSdkVersion.*/    targetSdk = 36/g' "$file"
            sed -i -E 's/.*compileSdk[[:space:]:=()]+.*/    compileSdk = 36/g' "$file"
            sed -i -E 's/.*targetSdk[[:space:]:=()]+.*/    targetSdk = 36/g' "$file"
          done

          echo "Patching Proguard references in pub-cache plugins..."
          find /home/runner/.pub-cache/hosted/pub.dev \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      - name: Build Android APK (Universal & Split)
        run: |
          echo "=== 1. Building Universal APK (All-in-One for all Android devices) ==="
          flutter build apk --release
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/${{ inputs.build_code }}_Universal.apk

          echo "=== 2. Building Split APK per ABI ==="
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apk/${{ inputs.build_code }}_arm64.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apk/${{ inputs.build_code }}_armeabi.apk || true

          ls -lh output_apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXAMPRO-APK-${{ inputs.build_code }}
          path: output_apk/
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 2: WINDOWS EXE BUILD (WINDOWS RUNNER)
  # ══════════════════════════════════════════════════════════════
  build-windows-exe:
    name: 'Build Windows (.EXE) - ${{ inputs.school_name }}'
    if: inputs.target_platform == 'EXE' || inputs.target_platform == 'ALL'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Fetch Custom Logo (Windows)
        if: inputs.logo_blob_sha != '' || inputs.logo_base64 != ''
        shell: powershell
        run: |
          if (!(Test-Path "assets")) { New-Item -ItemType Directory -Path "assets" }
          if ("${{ inputs.logo_blob_sha }}") {
            Write-Host "Downloading custom logo from GitHub Git Blob SHA: ${{ inputs.logo_blob_sha }}"
            $headers = @{
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              "Accept" = "application/vnd.github.raw"
              "X-GitHub-Api-Version" = "2022-11-28"
              "User-Agent" = "GitHub-Runner"
            }
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/git/blobs/${{ inputs.logo_blob_sha }}" -Headers $headers -OutFile "assets/logo.png"
          } elseif ("${{ inputs.logo_base64 }}") {
            [System.Convert]::FromBase64String("${{ inputs.logo_base64 }}") | Set-Content -Path "assets/logo.png" -Encoding Byte
          }
          Get-Item "assets/logo.png"

      - name: Fetch Custom Audio Alert (Windows)
        if: inputs.custom_audio_blob_sha != '' || inputs.custom_audio_base64 != ''
        shell: powershell
        run: |
          if (!(Test-Path "assets")) { New-Item -ItemType Directory -Path "assets" }
          if ("${{ inputs.custom_audio_blob_sha }}") {
            Write-Host "Downloading custom audio from GitHub Git Blob SHA: ${{ inputs.custom_audio_blob_sha }}"
            $headers = @{
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              "Accept" = "application/vnd.github.raw"
              "X-GitHub-Api-Version" = "2022-11-28"
              "User-Agent" = "GitHub-Runner"
            }
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/git/blobs/${{ inputs.custom_audio_blob_sha }}" -Headers $headers -OutFile "assets/alert.mp3"
          } elseif ("${{ inputs.custom_audio_base64 }}") {
            [System.Convert]::FromBase64String("${{ inputs.custom_audio_base64 }}") | Set-Content -Path "assets/alert.mp3" -Encoding Byte
          }
          Get-Item "assets/alert.mp3"

      - name: Inject Parameters to lib/main.dart (Windows)
        shell: powershell
        run: |
          $mainContent = Get-Content "lib/main.dart" -Raw
          $mainContent = $mainContent -replace 'final String schoolName = ".*";', 'final String schoolName = "${{ inputs.school_name }}";'
          $mainContent = $mainContent -replace 'final String exitPassword = ".*";', 'final String exitPassword = "${{ inputs.exit_pin }}";'
          $mainContent = $mainContent -replace 'final String customUserAgent = ".*";', 'final String customUserAgent = "${{ inputs.custom_user_agent }}";'
          $mainContent = $mainContent -replace 'final bool enableAlertAudio = .*;', 'final bool enableAlertAudio = ${{ inputs.enable_alert_sound }};'
          $mainContent = $mainContent -replace 'final double alertAudioVolume = .*;', 'final double alertAudioVolume = ${{ inputs.alert_volume }};'
          $mainContent = $mainContent -replace 'final double autoScreenBrightness = .*;', 'final double autoScreenBrightness = ${{ inputs.screen_brightness }};'
          $mainContent = $mainContent -replace 'String currentUrl = ".*";', 'String currentUrl = "${{ inputs.cbt_url }}";'
          $mainContent = $mainContent -replace 'currentUrl = "https://sites.google.com/guru.smp.belajar.id/asesmenpasmer/home";', 'currentUrl = "${{ inputs.cbt_url }}";'
          Set-Content -Path "lib/main.dart" -Value $mainContent

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Initialize Windows Platform
        shell: powershell
        run: |
          if (!(Test-Path "windows") -or !(Test-Path "android")) {
            flutter create . --org com.exambrowser.cbt --project-name exam_browser --platforms=windows,android
          }

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Generate Launcher Icons
        shell: powershell
        run: |
          try {
            dart run flutter_launcher_icons
          } catch {
            Write-Host "Launcher icons warning: $_"
          }

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows Application
        shell: powershell
        run: |
          flutter build windows --release

      - name: Compress Windows Output to ZIP
        shell: powershell
        run: |
          mkdir output_windows
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "output_windows\${{ inputs.build_code }}_Windows.zip"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXAMPRO-Windows-${{ inputs.build_code }}
          path: output_windows/
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 3: PUBLISH TO GITHUB RELEASES (DIRECT DOWNLOAD CDN)
  # ══════════════════════════════════════════════════════════════
  publish-release:
    name: 'Publish to GitHub Releases - ${{ inputs.school_name }}'
    needs: [build-android-apk, build-windows-exe]
    if: always() && !cancelled() && (needs.build-android-apk.result == 'success' || needs.build-windows-exe.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Staging Directory
        run: mkdir -p release_files

      - name: Download Android Artifacts
        if: needs.build-android-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: EXAMPRO-APK-${{ inputs.build_code }}
          path: release_files

      - name: Download Windows Artifacts
        if: needs.build-windows-exe.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: EXAMPRO-Windows-${{ inputs.build_code }}
          path: release_files

      - name: List Release Files
        run: ls -lh release_files/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v-${{ inputs.build_code }}"
          TITLE="${{ inputs.school_name }} - ${{ inputs.app_name }} (${{ inputs.build_code }})"
          NOTES="ExamBrowser CBT untuk ${{ inputs.school_name }} (${{ inputs.build_code }}). Siap di-install."
          echo "Target Release: $TAG"
          echo "Files to publish:"
          ls -lh release_files/

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets..."
            gh release upload "$TAG" release_files/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_files/* --title "$TITLE" --notes "$NOTES"
          fi
          echo "GitHub Release $TAG successfully published!"



